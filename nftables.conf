#!/usr/sbin/nft -f

flush ruleset

# =================================================================
# STUFE 1: Hardware-naher Filter
# =================================================================
table netdev early_drop {
    chain ingress {
        
        type filter hook ingress device "eth0" priority -500; policy accept;

      
        ip saddr 127.0.0.0/8 drop
        ip6 saddr ::1 drop

        
        ip frag-off & 0x1fff != 0 drop

        
        ip protocol icmp limit rate over 10/second drop
    }
}

# =================================================================
# STUFE 2: Firewall
# =================================================================
    chain input {
        type filter hook input priority 0; policy drop;

        ct state established,related accept

        ct state invalid drop

        
        iif "lo" accept
          
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
